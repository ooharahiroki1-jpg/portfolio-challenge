<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>咲陽 | 四柱推命・タロット・講師 / 名古屋</title>
<meta name="description" content="咲陽｜タロット・四柱推命・講師 / 名古屋。自分を知ると、未来はやさしくなる。" />
<style>
:root{
  --ink:#07101a;--navy:#0a1421;--gold:#e9c57f;--gold2:#f7deb0;--cream:#f6ede0;--muted:#cfc1ac;--line:rgba(244,214,155,.17);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#040a12}
body{margin:0;background:#060c15;color:var(--cream);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}
a{color:inherit;text-decoration:none}
.hero-shell{padding:0;background:#030912}
.hero{position:relative;width:100%;max-width:1672px;aspect-ratio:1672/941;margin:0 auto;overflow:hidden;background:#07101a;isolation:isolate}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;user-select:none;-webkit-user-drag:none}
#glints,#mist{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;mix-blend-mode:screen}
#mist{opacity:.28;z-index:1}
.layer{position:absolute;z-index:4;pointer-events:none;transform-origin:50% 50%;will-change:transform,left,top}
.layer img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.layer.sun{z-index:5}
.layer.earth{z-index:6;filter:drop-shadow(0 0 11px rgba(110,206,255,.36))}
.layer.card{z-index:7;filter:drop-shadow(0 18px 22px rgba(0,0,0,.30)) drop-shadow(0 0 10px rgba(255,214,131,.16))}
.sun-glow{position:absolute;z-index:3;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(255,205,112,.12),rgba(255,174,70,.04) 44%,transparent 70%);filter:blur(5px);mix-blend-mode:screen;animation:breathe 5.5s ease-in-out infinite}
.prom-sprite{position:absolute;z-index:4;pointer-events:none;opacity:0;mix-blend-mode:screen;transform-origin:50% 100%;filter:drop-shadow(0 0 7px rgba(255,180,76,.22));will-change:transform,opacity}
.water-sheen{position:absolute;left:31.4%;top:68%;width:30%;height:26%;z-index:2;pointer-events:none;overflow:hidden;mix-blend-mode:screen;opacity:.34;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.water-sheen::before{content:"";position:absolute;left:-20%;top:5%;width:140%;height:80%;background:repeating-linear-gradient(180deg,transparent 0 7%,rgba(255,224,168,.12) 7.5% 8.5%,transparent 9% 16%);transform:skewX(-10deg);animation:water 6s ease-in-out infinite}
.hotspot{position:absolute;z-index:12;border-radius:999px;outline:none}
.hotspot:focus-visible{box-shadow:0 0 0 3px rgba(255,223,164,.65)}
.hs-nav-about{left:24.2%;top:1.4%;width:6.2%;height:7.2%}.hs-nav-service{left:31.8%;top:1.4%;width:7.4%;height:7.2%}.hs-nav-profile{left:41.1%;top:1.4%;width:7.5%;height:7.2%}.hs-nav-voice{left:50.1%;top:1.4%;width:7.6%;height:7.2%}.hs-nav-column{left:59.3%;top:1.4%;width:6.1%;height:7.2%}.hs-nav-faq{left:65.4%;top:1.4%;width:8.2%;height:7.2%}.hs-nav-reserve{left:81.6%;top:1.4%;width:13.6%;height:7.2%}
.hs-view{left:5.3%;top:59.8%;width:17.3%;height:8.3%;border-radius:10px}.hs-reserve{left:23.8%;top:59.8%;width:17.4%;height:8.3%;border-radius:10px}
.motion-btn{position:absolute;right:1.1%;bottom:1.4%;z-index:15;background:rgba(6,12,20,.52);color:#f5ddb1;border:1px solid rgba(244,213,153,.32);border-radius:999px;padding:.65em 1em;font-size:clamp(10px,.68vw,13px);backdrop-filter:blur(10px);cursor:pointer}
.content{background:linear-gradient(180deg,#08111d 0%,#0c1725 48%,#08111b 100%)}
.section{padding:96px 24px;border-top:1px solid rgba(255,255,255,.045)}
.wrap{max-width:1120px;margin:0 auto}
.kicker{margin:0 0 12px;color:var(--gold2);font-size:12px;letter-spacing:.24em}
h2{margin:0 0 26px;font-size:clamp(34px,4.6vw,58px);line-height:1.18;font-weight:500;letter-spacing:.02em}
.lead{font-size:clamp(18px,2vw,23px);line-height:1.9;color:#f5ede2}
p{line-height:1.95;color:#d8cbb8;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card-ui{padding:30px;border:1px solid rgba(255,255,255,.07);border-radius:24px;background:linear-gradient(180deg,rgba(22,34,51,.72),rgba(9,16,27,.86));box-shadow:0 18px 44px rgba(0,0,0,.2);position:relative;overflow:hidden}
.card-ui::after{content:"";position:absolute;width:180px;height:180px;right:-70px;top:-70px;border-radius:50%;background:radial-gradient(circle,rgba(233,197,127,.11),transparent 68%);pointer-events:none}
.card-ui h3{margin:0 0 10px;font-size:27px;font-weight:550}.card-ui .sub{margin:0 0 18px;color:#f0d39b;font-size:15px}.card-ui ul{margin:0;padding-left:19px;display:grid;gap:10px;color:#eee4d5;line-height:1.65}
.soft{background:radial-gradient(circle at 50% 0,rgba(227,190,120,.07),transparent 28%),linear-gradient(180deg,rgba(15,26,42,.58),rgba(8,15,25,.86))}
.center{text-align:center}.narrow{max-width:880px;margin-left:auto;margin-right:auto}
.quote{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,3.8vw,49px);line-height:1.55;color:#fff3dc;text-align:center;margin:0 auto;max-width:900px}.quote small{display:block;margin-top:18px;font-family:inherit;font-size:13px;letter-spacing:.22em;color:#e7c887}
.flow-item span{display:inline-block;color:#e9c57f;font-size:12px;letter-spacing:.22em;margin-bottom:8px}.flow-item h3{font-size:21px;margin:0 0 8px}.flow-item p{font-size:15px;margin:0}
.profile-line{display:flex;align-items:center;gap:18px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.profile-mark{width:56px;height:56px;border:1px solid rgba(239,207,144,.48);border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;color:#f3d595;font-size:24px}.profile-line strong{font-size:20px}.profile-line span{display:block;margin-top:4px;color:#cdbfa9;font-size:14px}
details{border:1px solid rgba(255,255,255,.07);background:rgba(13,22,36,.74);border-radius:18px;padding:20px 22px}details+details{margin-top:12px}summary{cursor:pointer;font-size:18px;color:#fff0d7;font-weight:600}details p{margin:12px 0 0;font-size:15px}
.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:26px}.action{padding:14px 24px;border-radius:999px;background:linear-gradient(180deg,#f0d9aa,#dfb96f);color:#201508;font-weight:700}.action.alt{background:transparent;color:#f5e8d0;border:1px solid rgba(238,204,139,.34)}
.note{font-size:13px;color:#aa9e8d;margin-top:20px}
@keyframes breathe{0%,100%{transform:scale(.96);opacity:.6}50%{transform:scale(1.08);opacity:1}}@keyframes water{0%,100%{transform:translateX(-2%) skewX(-10deg)}50%{transform:translateX(3%) skewX(-10deg)}}
@media(max-width:900px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.section{padding:72px 20px}.hero{min-width:100%;}.motion-btn{display:none}}
@media(max-width:640px){.hero-shell{overflow-x:auto}.hero{width:1000px;max-width:none}.section{padding:62px 18px}.lead,p{font-size:16px}.quote{font-size:30px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.motion-btn{display:none}.water-sheen,.prom-sprite{display:none!important}}
</style>
</head>
