name: Enable GitHub Pages
on:
  push:
    branches: ["gh-pages"]
permissions:
  contents: read
  pages: write
jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          API="https://api.github.com/repos/${REPO}/pages"
          BODY='{"source":{"branch":"gh-pages","path":"/"}}'
          CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" -d "$BODY" || true)
          cat /tmp/pages.json || true
          if [ "$CODE" = "201" ] || [ "$CODE" = "204" ]; then exit 0; fi
          if [ "$CODE" = "409" ] || [ "$CODE" = "422" ]; then
            curl -sS -L -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" -d "$BODY" || true
            exit 0
          fi
          exit 1
